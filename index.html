<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake — La Collective</title>
  <style>
    :root {
      --bg: #0f1720;
      --panel: #16212e;
      --grid: #1c2a3a;
      --snake: #4ade80;
      --snake-head: #86efac;
      --food: #f472b6;
      --text: #e2e8f0;
      --muted: #7d8ba0;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: radial-gradient(circle at 50% 0%, #1a2634, var(--bg) 70%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    .wrap {
      width: min(94vw, 460px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 12px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    h1 {
      font-size: 1.7rem;
      letter-spacing: 1px;
      font-weight: 800;
    }
    h1 span { color: var(--snake); }
    .scores {
      display: flex;
      gap: 18px;
      font-variant-numeric: tabular-nums;
    }
    .scores div { text-align: right; }
    .scores .label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
    }
    .scores .value { font-size: 1.25rem; font-weight: 700; }
    .board-wrap {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: 0 20px 50px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    canvas { display: block; width: 100%; height: auto; touch-action: none; }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      background: rgba(15, 23, 32, 0.82);
      backdrop-filter: blur(3px);
      padding: 20px;
      transition: opacity 0.25s;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay h2 { font-size: 1.5rem; }
    .overlay p { color: var(--muted); max-width: 26ch; line-height: 1.5; font-size: 0.9rem; }
    button {
      font: inherit;
      font-weight: 700;
      color: #05121a;
      background: var(--snake);
      border: none;
      padding: 12px 26px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.1s, filter 0.15s;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(0.96); }
    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.6;
    }
    kbd {
      background: var(--grid);
      border-radius: 5px;
      padding: 2px 7px;
      font-size: 0.72rem;
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>SNAKE<span>.</span></h1>
      <div class="scores">
        <div><div class="label">Score</div><div class="value" id="score">0</div></div>
        <div><div class="label">Record</div><div class="value" id="best">0</div></div>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="game" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">Prêt à jouer&nbsp;?</h2>
        <p id="ov-text">Mange les pommes, grandis, et évite ta propre queue et les murs.</p>
        <button id="startBtn">Commencer</button>
      </div>
    </div>

    <div class="hint">
      <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> ou <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> pour bouger &middot; <kbd>Espace</kbd> pause<br />
      Sur mobile&nbsp;: glisse ton doigt dans une direction.
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const overlay = document.getElementById("overlay");
    const ovTitle = document.getElementById("ov-title");
    const ovText = document.getElementById("ov-text");
    const startBtn = document.getElementById("startBtn");

    const GRID = 20;            // 20 x 20 cells
    const CELL = canvas.width / GRID;

    let snake, dir, nextDir, food, score, best, running, paused, speed, tickAcc, lastTime;

    best = Number(localStorage.getItem("snake_best") || 0);
    bestEl.textContent = best;

    function reset() {
      snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      speed = 8;               // cells per second, ramps up
      tickAcc = 0;
      placeFood();
      updateScore();
    }

    function placeFood() {
      while (true) {
        const f = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID),
        };
        if (!snake.some((s) => s.x === f.x && s.y === f.y)) { food = f; return; }
      }
    }

    function updateScore() {
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem("snake_best", best);
      }
    }

    function startGame() {
      reset();
      running = true;
      paused = false;
      overlay.classList.add("hidden");
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      running = false;
      ovTitle.textContent = "Perdu&nbsp;!";
      ovTitle.innerHTML = "Perdu&nbsp;!";
      ovText.textContent = `Score : ${score}. ${score >= best ? "Nouveau record ! 🎉" : "Tu peux faire mieux."}`;
      startBtn.textContent = "Rejouer";
      overlay.classList.remove("hidden");
    }

    function loop(now) {
      if (!running) return;
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      if (!paused) {
        tickAcc += dt;
        const step = 1 / speed;
        while (tickAcc >= step) {
          tickAcc -= step;
          tick();
          if (!running) return;
        }
      }
      draw();
      requestAnimationFrame(loop);
    }

    function tick() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // walls
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        return gameOver();
      }
      // self
      if (snake.some((s) => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 1;
        updateScore();
        speed = Math.min(18, 8 + score * 0.35); // gradual acceleration
        placeFood();
      } else {
        snake.pop();
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function draw() {
      // background grid
      ctx.fillStyle = getCss("--panel");
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = getCss("--grid");
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
      }

      // food
      const fx = food.x * CELL, fy = food.y * CELL;
      ctx.fillStyle = getCss("--food");
      ctx.shadowColor = getCss("--food");
      ctx.shadowBlur = 12;
      roundRect(fx + CELL * 0.2, fy + CELL * 0.2, CELL * 0.6, CELL * 0.6, CELL * 0.3);
      ctx.fill();
      ctx.shadowBlur = 0;

      // snake
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? getCss("--snake-head") : getCss("--snake");
        const pad = i === 0 ? 1.5 : 2.5;
        roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
        ctx.fill();
      });

      if (paused) {
        ctx.fillStyle = "rgba(15,23,32,0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 22px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("PAUSE", canvas.width / 2, canvas.height / 2);
      }
    }

    const cssCache = {};
    function getCss(name) {
      if (!cssCache[name]) {
        cssCache[name] = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }
      return cssCache[name];
    }

    function setDir(x, y) {
      // prevent 180° reversal
      if (x === -dir.x && y === -dir.y) return;
      nextDir = { x, y };
    }

    document.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()) || " " === e.key) e.preventDefault();
      if (k === "arrowup" || k === "z" || k === "w") setDir(0, -1);
      else if (k === "arrowdown" || k === "s") setDir(0, 1);
      else if (k === "arrowleft" || k === "q" || k === "a") setDir(-1, 0);
      else if (k === "arrowright" || k === "d") setDir(1, 0);
      else if (e.key === " ") {
        if (running) { paused = !paused; draw(); }
      }
    });

    // touch / swipe
    let touchStart = null;
    canvas.addEventListener("touchstart", (e) => {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    canvas.addEventListener("touchmove", (e) => {
      if (!touchStart) return;
      const dx = e.touches[0].clientX - touchStart.x;
      const dy = e.touches[0].clientY - touchStart.y;
      if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else setDir(0, dy > 0 ? 1 : -1);
      touchStart = null;
    }, { passive: true });

    startBtn.addEventListener("click", startGame);

    // initial draw of empty board
    reset();
    draw();
  </script>
</body>
</html>
